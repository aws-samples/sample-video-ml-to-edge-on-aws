#
# Tests, CDK synth and the checkov gate. No job has AWS credentials; deploying is
# the operator's step (README "Deploy").
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CHECKOV_VERSION: "3.3.1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements-dev.txt
      # tests/site included: the gateway runs Python 3.12 with these package versions.
      - run: python -m pytest -q --ignore=tests/train

  # Trains tiny3d for two epochs on generated clips and runs the gateway self-test
  # on the output; CPU-only torch keeps the job small.
  train-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements-train.txt
      - run: python -m pytest -q tests/train

  infra:
    runs-on: ubuntu-24.04
    env:
      # Hashing the OpenCV layer and gateway wheel assets exceeds the default heap.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: python -m venv .venv && bash scripts/fetch_layer_and_wheels.sh
      - working-directory: infra
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
          npx jest
          npx cdk synth -q -o cdk.out
          for s in ConveyorIntake ConveyorMl ConveyorSite-factory-a ConveyorSite-factory-b; do test -s "cdk.out/$s.template.json"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: templates
          path: infra/cdk.out/*.template.json
          retention-days: 1

  checkov:
    needs: infra
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: templates
          path: infra/cdk.out
      - run: pip install --quiet "checkov==$CHECKOV_VERSION"
      - run: python scripts/ci/checkov_gate.py infra/cdk.out
